<style>
  :root {
    --primary: #1a1a2e;
    --accent:  #16c79a;
    --accent2: #e94560;
    --bg:      #f4f6fb;
    --surface: #ffffff;
    --muted:   #6b7280;
    --border:  #e5e7eb;
    --radius:  12px;
    --shadow:  0 2px 12px rgba(0,0,0,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', sans-serif;
    background: var(--bg); color: var(--primary);
    min-height: 100vh; padding: 16px;
  }
  .app { max-width: 720px; margin: 0 auto; }
  .header { text-align: center; padding: 24px 0 16px; }
  .header h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
  .header h1 span { color: var(--accent); }
  .header p { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .card {
    background: var(--surface); border-radius: var(--radius);
    border: 1px solid var(--border); box-shadow: var(--shadow);
    padding: 20px; margin-bottom: 16px;
  }
  .card-title { font-size: 15px; font-weight: 600; margin-bottom: 14px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.5px; }
  input[type="text"], input[type="password"], select {
    width: 100%; padding: 10px 14px;
    border: 1.5px solid var(--border); border-radius: 8px;
    font-size: 15px; font-family: inherit; color: var(--primary);
    background: #fafafa; transition: border-color 0.15s;
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); background: #fff; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 11px 20px; border-radius: 8px; font-size: 14px; font-weight: 600;
    cursor: pointer; border: 1.5px solid transparent; transition: all 0.15s;
    font-family: inherit;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-primary:hover { background: #12a880; }
  .btn-secondary { background: var(--primary); color: #fff; border-color: var(--primary); }
  .btn-outline { background: transparent; color: var(--primary); border-color: var(--border); }
  .btn-outline:hover { background: var(--bg); }
  .btn-full { width: 100%; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
  .tabs { display: flex; border-bottom: 2px solid var(--border); margin-bottom: 18px; }
  .tab-btn {
    flex: 1; padding: 10px; font-size: 14px; font-weight: 600;
    background: none; border: none; cursor: pointer;
    color: var(--muted); border-bottom: 2px solid transparent;
    margin-bottom: -2px; font-family: inherit; transition: all 0.15s;
  }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .room-code {
    font-size: 42px; font-weight: 800; letter-spacing: 10px; text-align: center;
    color: var(--primary); padding: 18px; background: var(--bg);
    border-radius: var(--radius); margin: 10px 0;
    font-variant-numeric: tabular-nums; border: 2px dashed var(--border);
  }
  .players-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; margin: 12px 0; }
  .player-chip {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg); font-size: 13px;
  }
  .player-chip.empty { opacity: 0.4; }
  .avatar {
    width: 30px; height: 30px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; flex-shrink: 0;
  }
  .badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 20px; }
  .badge-green  { background: #d1fae5; color: #065f46; }
  .badge-blue   { background: #dbeafe; color: #1e40af; }
  .badge-yellow { background: #fef3c7; color: #92400e; }
  .badge-red    { background: #fee2e2; color: #991b1b; }
  .round-dots { display: flex; gap: 5px; flex-wrap: wrap; }
  .round-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--border); }
  .round-dot.done    { background: var(--accent); }
  .round-dot.current { background: var(--primary); }
  .bid-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .bid-row:last-child { border-bottom: none; }
  .bid-name { width: 72px; font-size: 13px; font-weight: 600; flex-shrink: 0; }
  .result-item { padding: 10px 14px; border-radius: 8px; margin-bottom: 6px; border: 1.5px solid; font-size: 13px; }
  .result-ok   { background: #f0fdf4; border-color: #86efac; }
  .result-ng   { background: #fff1f2; border-color: #fda4af; }
  .result-horse { font-weight: 700; font-size: 15px; }
  .result-bidders { color: var(--muted); margin-top: 2px; }
  .conflict-box { background: #fff1f2; border: 1.5px solid #fca5a5; border-radius: 10px; padding: 14px; margin-bottom: 8px; }
  .conflict-box h4 { font-size: 13px; color: #b91c1c; margin-bottom: 8px; }
  .conflict-winner-btns { display: flex; flex-wrap: wrap; gap: 6px; }

  .rebid-box h4 { font-size: 13px; color: #92400e; margin-bottom: 8px; }
  .roster-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
  .roster-col { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .roster-head { padding: 7px 8px; font-size: 12px; font-weight: 700; text-align: center; background: var(--bg); }
  .roster-row { padding: 5px 8px; font-size: 12px; border-top: 1px solid var(--border); }
  .roster-row.empty { color: #c4c4c4; font-style: italic; }
  .waiting-icon { font-size: 36px; text-align: center; animation: pulse 1.5s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  .submitted-progress { margin-top: 10px; padding: 10px 14px; border-radius: 8px; background: var(--bg); border: 1px solid var(--border); font-size: 13px; }
  .screen { display: none; }
  .screen.active { display: block; }
  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--primary); color: #fff;
    padding: 10px 20px; border-radius: 8px;
    font-size: 13px; font-weight: 600;
    transition: transform 0.3s; z-index: 999; white-space: nowrap;

  .finish-hero { text-align: center; padding: 28px 0 20px; }
  .finish-hero .trophy { font-size: 56px; }
  .finish-hero h2 { font-size: 22px; font-weight: 700; margin-top: 10px; }
  .finish-hero p { color: var(--muted); font-size: 14px; margin-top: 4px; }
  #setup-warning {
    background: #fff3cd; border: 1.5px solid #ffc107;
    border-radius: var(--radius); padding: 14px 18px;
    font-size: 13px; color: #664d03; margin-bottom: 16px; line-height: 1.7;

  #setup-warning strong { display: block; font-size: 14px; margin-bottom: 4px; }
  #setup-warning code { background: #fff; padding: 1px 5px; border-radius: 4px; font-size: 12px; }

<body>
<div id="toast"></div>

<div class="app">

  </div>

  <div id="setup-warning" style="display:none">
    <strong>⚠️ Firebase の設定が必要です</strong>
    このファイルの先頭にある <code>FIREBASE_CONFIG</code> の <code>YOUR_...</code> の部分を
    自分のFirebaseプロジェクトの値に書き換えてください。
  </div>

  <!-- ① ロビー画面 -->
  <div id="screen-lobby" class="screen active">
    <div class="card">
      <div class="tabs">
        <button class="tab-btn active" id="tab-create" onclick="switchTab('create')">ルームを作成</button>
        <button class="tab-btn"        id="tab-join"   onclick="switchTab('join')">ルームに参加</button>
      </div>
      <div id="pane-create">
        <div class="field">
          <label>あなたの名前</label>
          <input type="text" id="create-name" placeholder="例：田中" maxlength="12">
        </div>
        <div class="field">
          <label>参加人数（2〜10名）</label>
          <select id="create-count">
            <option value="2">2名</option><option value="3">3名</option>
            <option value="4">4名</option><option value="5">5名</option>
            <option value="6" selected>6名</option><option value="7">7名</option>
            <option value="8">8名</option><option value="9">9名</option>
            <option value="10">10名</option>
          </select>
        </div>
        <div class="field">
          <label>巡回数（ラウンド数）</label>
          <select id="create-rounds">
            <option value="5">5巡</option><option value="8">8巡</option>
            <option value="10" selected>10巡</option><option value="12">12巡</option>
            <option value="15">15巡</option>
          </select>
        </div>
        <button class="btn btn-primary btn-full" onclick="createRoom()">🎯 ルームを作成する</button>
      </div>
      <div id="pane-join" style="display:none">
        <div class="field">
          <label>あなたの名前</label>
          <input type="text" id="join-name" placeholder="例：鈴木" maxlength="12">
        </div>
        <div class="field">
          <label>ルームコード（4桁）</label>
          <input type="text" id="join-code" placeholder="1234" maxlength="4"
            style="text-align:center;font-size:26px;font-weight:700;letter-spacing:8px">
        </div>
        <button class="btn btn-primary btn-full" onclick="joinRoom()">🚪 参加する</button>
      </div>
    </div>
  </div>

  <!-- ② 待機室 -->
  <div id="screen-waiting" class="screen">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div class="card-title" style="margin:0">ルームコード</div>
        <span class="badge badge-yellow" id="waiting-count-badge">0/6名</span>
      </div>
      <div class="room-code" id="waiting-code">----</div>
      <p style="font-size:12px;color:var(--muted);text-align:center;margin-bottom:14px">
        📤 このコードを参加者全員に共有してください
      </p>
      <div class="players-grid" id="waiting-players"></div>
      <div id="host-controls" style="display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">
        <p style="font-size:13px;color:var(--muted);margin-bottom:10px">全員が揃ったらドラフトを開始できます</p>
        <button class="btn btn-secondary btn-full" id="btn-start" onclick="hostStartDraft()">
          ▶️ ドラフト開始
        </button>
      </div>
    </div>
  </div>

  <!-- ③ ドラフト画面 -->
  <div id="screen-draft" class="screen">
    <div class="card" style="padding:14px 20px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <div>
          <span style="font-size:17px;font-weight:700" id="round-label">第1巡目</span>
          <span class="badge badge-blue" style="margin-left:8px" id="phase-badge">入力中</span>
        </div>
        <div class="round-dots" id="round-dots"></div>
      </div>
    </div>

    <div class="card" id="action-card">
      <!-- 入力フェーズ（未提出） -->
      <div id="phase-input">
        <div class="card-title" id="input-title">母馬を指名してください</div>
        <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-bottom:12px;cursor:pointer">
          <input type="checkbox" id="mask-toggle" onchange="toggleMask()">
          入力文字を隠す（周りに見えないように）
        </label>
        <div id="bid-input-area"></div>
        <div id="bid-progress" style="font-size:12px;color:var(--muted);margin:10px 0"></div>
        <button class="btn btn-primary btn-full" onclick="submitBid()" id="btn-submit">
          ✅ 指名を確定する
        </button>
      </div>

      <!-- 入力フェーズ（提出済み） -->
      <div id="phase-waiting" style="display:none">
        <div class="waiting-icon">⏳</div>
        <p style="text-align:center;font-size:14px;font-weight:600;margin:12px 0 4px" id="waiting-msg">他の参加者の入力を待っています</p>
        <div class="submitted-progress" id="submitted-progress"></div>
      </div>

      <!-- 公開フェーズ -->
      <div id="phase-reveal" style="display:none">
        <div class="card-title">🎊 一斉公開！</div>
        <div id="reveal-results"></div>
        <div id="conflict-area"></div>
        <div id="rebid-area"></div>
        <button class="btn btn-secondary btn-full" id="btn-next" onclick="proceedNext()" style="margin-top:14px;display:none">
          次のラウンドへ →
        </button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">📋 指名状況ボード</div>
      <div class="roster-grid" id="roster-board"></div>
    </div>
  </div>

  <!-- ④ 終了画面 -->
  <div id="screen-finish" class="screen">
    <div class="card">
      <div class="finish-hero">
        <div class="trophy">🏆</div>
        <h2>ドラフト終了！</h2>
        <p>お疲れ様でした。最終ロスターをご確認ください。</p>
      </div>
    </div>
    <div class="card">
      <div class="card-title">最終ロスター</div>
      <div class="roster-grid" id="final-roster"></div>
    </div>
    <button class="btn btn-outline btn-full" onclick="resetApp()">🔄 最初に戻る</button>
  </div>
</div>

<script>
const COLORS = ['#16c79a','#e94560','#4f8ef7','#f5a623','#a855f7','#ec4899','#14b8a6','#f97316','#8b5cf6','#06b6d4'];

let me = { name: '', roomCode: '', isHost: false };
let db = null;
let roomRef = null;
let unsubscribe = null;
let lastSnapshot = null;

function initFirebase() {
  if (FIREBASE_CONFIG.apiKey === 'YOUR_API_KEY') {
    document.getElementById('setup-warning').style.display = 'block';
    return false;
  }
  try {
    const app = firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.database(app);
    return true;
  } catch(e) {
    document.getElementById('setup-warning').style.display = 'block';
    return false;
  }
}

function genCode() { return String(Math.floor(1000 + Math.random() * 9000)); }

// 全角・半角を統一して比較用に正規化する
function normalizeHorse(str) {
  if (!str) return '';
  let s = str.trim();

  // 半角カタカナ（濁点・半濁点込み）→ 全角カタカナ
  const hankaku = 'ｦｧｨｩｪｫｬｭｮｯｰｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝﾞﾟ';
  const zenkaku = 'ヲァィゥェォャュョッーアイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワン゛゜';
  // 濁点・半濁点付き文字の変換テーブル
  const dakuten = {
    'カ':'ガ','キ':'ギ','ク':'グ','ケ':'ゲ','コ':'ゴ',
    'サ':'ザ','シ':'ジ','ス':'ズ','セ':'ゼ','ソ':'ゾ',
    'タ':'ダ','チ':'ヂ','ツ':'ヅ','テ':'デ','ト':'ド',
    'ハ':'バ','ヒ':'ビ','フ':'ブ','ヘ':'ベ','ホ':'ボ',
    'ウ':'ヴ'
  };
  const handakuten = {
    'ハ':'パ','ヒ':'ピ','フ':'プ','ヘ':'ペ','ホ':'ポ'
  };

  // まず半角カタカナを1文字ずつ全角に変換（濁点・半濁点は後処理）
  let result = '';
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    const idx = hankaku.indexOf(c);
    if (idx >= 0) {
      const zen = zenkaku[idx];
      if (zen === '゛' && result.length > 0) {
        const prev = result[result.length - 1];
        result = result.slice(0, -1) + (dakuten[prev] || prev + '゛');
      } else if (zen === '゜' && result.length > 0) {
        const prev = result[result.length - 1];
        result = result.slice(0, -1) + (handakuten[prev] || prev + '゜');
      } else {
        result += zen;
      }
    } else {
      result += c;
    }
  }
  s = result;

  // 全角英数字→半角
  s = s.replace(/[Ａ-Ｚａ-ｚ０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
  // 全角スペース→半角
  s = s.replace(/　/g, ' ');
  // 小文字化
  return s.toLowerCase();
}
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
}
function toast(msg, dur=2500) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), dur);
}
function switchTab(t) {
  document.getElementById('tab-create').classList.toggle('active', t==='create');
  document.getElementById('tab-join').classList.toggle('active', t==='join');
  document.getElementById('pane-create').style.display = t==='create' ? '' : 'none';
  document.getElementById('pane-join').style.display   = t==='join'   ? '' : 'none';
}

async function createRoom() {
  if (!db) { toast('Firebase が設定されていません'); return; }
  const name = document.getElementById('create-name').value.trim();
  if (!name) { toast('名前を入力してください'); return; }
  const count  = parseInt(document.getElementById('create-count').value);
  const rounds = parseInt(document.getElementById('create-rounds').value);
  const code   = genCode();
  const room = {
    code, hostName: name,
    playerCount: count, maxRounds: rounds,
    players: [{ name, color: COLORS[0] }],
    rosters: { [name]: [] },
    status: 'waiting',
    round: 1, phase: 'input',
    bids: {}, conflicts: [], resolvedConflicts: {},
    rebidPlayers: []
  };
  await db.ref('pog/rooms/' + code).set(room);
  me = { name, roomCode: code, isHost: true };
  subscribeRoom(code);
  showScreen('waiting');
}

async function joinRoom() {
  if (!db) { toast('Firebase が設定されていません'); return; }
  const name = document.getElementById('join-name').value.trim();
  const code = document.getElementById('join-code').value.trim();
  if (!name) { toast('名前を入力してください'); return; }
  if (code.length !== 4) { toast('4桁のコードを入力してください'); return; }
  const snap = await db.ref('pog/rooms/' + code).get();
  if (!snap.exists()) { toast('ルームが見つかりません'); return; }
  const room = snap.val();
  if (room.status !== 'waiting') { toast('このルームはすでに開始しています'); return; }
  if (room.players.find(p => p.name === name)) { toast('同じ名前の参加者がいます'); return; }
  if (room.players.length >= room.playerCount) { toast('ルームが満員です'); return; }
  const newPlayers = [...room.players, { name, color: COLORS[room.players.length % COLORS.length] }];
  const newRosters = { ...room.rosters, [name]: [] };
  await db.ref('pog/rooms/' + code).update({ players: newPlayers, rosters: newRosters });
  me = { name, roomCode: code, isHost: false };
  subscribeRoom(code);
  showScreen('waiting');
}

function subscribeRoom(code) {
  if (unsubscribe) unsubscribe();
  roomRef = db.ref('pog/rooms/' + code);
  const handler = snap => {
    if (!snap.exists()) return;
    const room = snap.val();
    const roomStr = JSON.stringify(room);
    if (roomStr === lastSnapshot) return;
    lastSnapshot = roomStr;
    handleRoomUpdate(room);
  };
  roomRef.on('value', handler);
  unsubscribe = () => roomRef.off('value', handler);
}

function handleRoomUpdate(room) {
  const current = document.querySelector('.screen.active')?.id || '';
  if (room.status === 'waiting') { renderWaiting(room); return; }
  if (room.status === 'drafting') {
    if (current !== 'screen-draft') showScreen('draft');
    renderDraft(room);
  }
  if (room.status === 'finished') {
    showScreen('finish');
    renderFinalRoster(room);
    if (unsubscribe) unsubscribe();
  }
}

function renderWaiting(room) {
  const count = room.players.length;
  const max   = room.playerCount;
  document.getElementById('waiting-code').textContent = room.code;
  document.getElementById('waiting-count-badge').textContent = `${count}/${max}名`;
  const grid = document.getElementById('waiting-players');
  grid.innerHTML = room.players.map(p =>
    `<div class="player-chip">
      <div class="avatar" style="background:${p.color}22;color:${p.color}">${p.name[0]}</div>
      <span style="font-size:13px">${p.name}</span>
      ${p.name === room.hostName ? '<span class="badge badge-blue" style="margin-left:auto">主催</span>' : ''}
    </div>`
  ).join('') + Array(Math.max(0, max-count)).fill(0).map(() =>
    `<div class="player-chip empty">
      <div class="avatar" style="background:#f3f4f6;color:#d1d5db">?</div>
      <span style="font-size:13px;color:#d1d5db">待機中...</span>
    </div>`
  ).join('');
  if (me.isHost) {
    document.getElementById('host-controls').style.display = '';
    const btn = document.getElementById('btn-start');
    btn.disabled = count < max;
    btn.textContent = count < max ? `▶️ ドラフト開始（あと${max-count}名）` : '▶️ ドラフト開始';
  }
}

async function hostStartDraft() {
  await roomRef.update({ status: 'drafting', phase: 'input', bids: {}, round: 1, rebidPlayers: [] });
}

function renderDraft(room) {
  const dots = document.getElementById('round-dots');
  dots.innerHTML = Array(room.maxRounds).fill(0).map((_, i) => {
    const cls = i < room.round-1 ? 'done' : i === room.round-1 ? 'current' : '';
    return `<div class="round-dot ${cls}"></div>`;
  }).join('');
  document.getElementById('round-label').textContent = `第${room.round}巡目`;

  const bids = room.bids || {};
  const rebidPlayers = room.rebidPlayers || [];

  // 今このユーザーが入力すべきか判定
  // 通常入力：bidsにまだ自分のエントリーがない
  // 外れ再指名：rebidPlayersに自分が含まれ、bidsにまだ自分のエントリーがない
  const needsInput = bids[me.name] === undefined;
  const isRebidPhase = rebidPlayers.length > 0;
  const iAmRebidder = rebidPlayers.includes(me.name);

  document.getElementById('phase-input').style.display   = 'none';
  document.getElementById('phase-waiting').style.display = 'none';
  document.getElementById('phase-reveal').style.display  = 'none';

  if (room.phase === 'input') {
    document.getElementById('phase-badge').textContent = isRebidPhase ? '外れ再指名' : '入力中';
    document.getElementById('phase-badge').className = 'badge ' + (isRebidPhase ? 'badge-yellow' : 'badge-blue');

    const editingPlayer = room.editingPlayer || null;
    const isEditPhase = !!editingPlayer;

    if (isRebidPhase && !iAmRebidder) {
      // 自分は再指名不要 → 待機表示
      document.getElementById('phase-waiting').style.display = '';
      renderWaitingProgress(room, rebidPlayers);
    } else if (isEditPhase && !needsInput) {
      // 修正フェーズ：自分は提出済み → 待機
      document.getElementById('phase-waiting').style.display = '';
      renderWaitingProgress(room, room.players.map(p=>p.name));
    } else if (needsInput) {
      // 自分が入力すべき（通常 or 修正フェーズで自分以外）
      document.getElementById('phase-input').style.display = '';
      const btn = document.getElementById('btn-submit');
      btn.disabled = false;
      const title = isEditPhase
        ? `✏️ ${editingPlayer}さんが入力を修正しました。再度入力してください`
        : isRebidPhase ? '🔄 外れ指名 — 別の母馬を指名してください' : '母馬を指名してください';
      document.getElementById('input-title').textContent = title;
      renderBidInput(room, isRebidPhase);
    } else {
      // 提出済み → 待機
      document.getElementById('phase-waiting').style.display = '';
      renderWaitingProgress(room, isRebidPhase ? rebidPlayers : room.players.map(p=>p.name));
    }
  } else if (room.phase === 'reveal' || room.phase === 'conflict') {
    document.getElementById('phase-badge').textContent = room.phase === 'conflict' ? '競合解決中' : '公開中';
    document.getElementById('phase-badge').className = 'badge ' + (room.phase === 'conflict' ? 'badge-red' : 'badge-green');
    document.getElementById('phase-reveal').style.display = '';
    renderReveal(room);
  }

  renderRosterBoard(room, 'roster-board');
}

function renderBidInput(room, isRebid) {
  const me_info = room.players.find(p => p.name === me.name);
  const color   = me_info ? me_info.color : '#888';
  const isMask  = document.getElementById('mask-toggle').checked;
  const t       = isMask ? 'password' : 'text';
  document.getElementById('input-title').textContent = isRebid ? '🔄 外れ指名 — 別の母馬を指名してください' : '母馬を指名してください';
  document.getElementById('bid-input-area').innerHTML = `
    <div class="bid-row">
      <div class="bid-name" style="color:${color}">${me.name}</div>
      <input type="${t}" id="my-bid" placeholder="母馬名を入力" class="bid-input" style="flex:1">
    </div>`;
  const rebidPlayers = room.rebidPlayers || [];
  const bids = room.bids || {};
  const targetPlayers = isRebid ? rebidPlayers : room.players.map(p=>p.name);
  const submitted = targetPlayers.filter(n => bids[n] !== undefined).length;
  document.getElementById('bid-progress').textContent = `${submitted}/${targetPlayers.length}名が提出済み`;
}

function toggleMask() {
  const t = document.getElementById('mask-toggle').checked ? 'password' : 'text';
  document.querySelectorAll('.bid-input').forEach(el => el.type = t);
}

function renderWaitingProgress(room, targetPlayerNames) {
  const bids  = room.bids || {};
  const players = Array.isArray(targetPlayerNames)
    ? targetPlayerNames
    : room.players.map(p => p.name);
  const done  = players.filter(n => bids[n] !== undefined).length;
  document.getElementById('waiting-msg').textContent = `他の参加者を待っています (${done}/${players.length}名完了)`;
  document.getElementById('submitted-progress').innerHTML = players.map(n =>
    `<span class="badge ${bids[n]!==undefined?'badge-green':'badge-yellow'}" style="margin:2px">
      ${n} ${bids[n]!==undefined?'✓':'…'}
    </span>`
  ).join('');
}

async function submitBid() {
  const val = document.getElementById('my-bid')?.value?.trim();
  if (!val) { toast('母馬名を入力してください'); return; }

  const btn = document.getElementById('btn-submit');
  btn.disabled = true;

  const snap = await roomRef.get();
  const room = snap.val();

  // 確定済みの馬（ロスターに入っている馬）のみ弾く（全角半角統一して比較）
  const allNominated = Object.values(room.rosters || {}).flat();
  if (allNominated.some(h => normalizeHorse(h) === normalizeHorse(val))) {
    toast(`「${val}」はすでに指名されています！`);
    btn.disabled = false;
    return;
  }
  const bids = room.bids || {};
  const rebidPlayers = room.rebidPlayers || [];
  const isRebidPhase = rebidPlayers.length > 0;

  // 保存前に正規化（全角半角統一）
  bids[me.name] = normalizeHorse(val);

  // 今回入力すべき人全員が揃ったか
  const targetPlayers = isRebidPhase ? rebidPlayers : room.players.map(p => p.name);
  const allDone = targetPlayers.every(n => bids[n] !== undefined);
  const update = { bids };

  if (allDone) {
    const result = calcReveal(targetPlayers, bids, room.rosters || {});
    update.rosters    = result.rosters;
    update.conflicts  = result.conflicts;
    update.resolvedConflicts = {};
    update.phase      = result.conflicts.length > 0 ? 'conflict' : 'reveal';
    update.rebidPlayers = [];
    update.editingPlayer = null;
  }

  await roomRef.update(update);

  document.getElementById('phase-input').style.display   = 'none';
  document.getElementById('phase-waiting').style.display = '';
}

function calcReveal(targetPlayerNames, bids, rosters) {
  const horseMap = {};
  // 正規化キーで同一馬判定、表示名は最初に入力した人のものを使う
  const normalizeMap = {}; // 正規化キー → 最初の表示名
  for (const name of targetPlayerNames) {
    const horse = bids[name];
    if (!horse) continue;
    const key = normalizeHorse(horse);
    if (!normalizeMap[key]) normalizeMap[key] = horse;
    const displayHorse = normalizeMap[key];
    if (!horseMap[displayHorse]) horseMap[displayHorse] = [];
    horseMap[displayHorse].push(name);
  }
  const newRosters = JSON.parse(JSON.stringify(rosters));
  const conflicts  = [];
  for (const [horse, bidders] of Object.entries(horseMap)) {
    if (bidders.length === 1) {
      if (!newRosters[bidders[0]]) newRosters[bidders[0]] = [];
      newRosters[bidders[0]].push(horse);
    } else {
      conflicts.push({ horse, bidders });
    }
  }
  return { rosters: newRosters, conflicts };
}

function renderReveal(room) {
  const bids = room.bids || {};
  const rebidPlayers = room.rebidPlayers || [];
  const isRebidPhase = rebidPlayers.length > 0;
  const targetPlayers = isRebidPhase ? rebidPlayers : room.players.map(p => p.name);

  const horseMap = {};
  for (const name of targetPlayers) {
    const h = bids[name];
    if (!h) continue;
    if (!horseMap[h]) horseMap[h] = [];
    horseMap[h].push(name);
  }

  let html = '';
  for (const [horse, bidders] of Object.entries(horseMap)) {
    const ok = bidders.length === 1;
    const isMine = bidders.includes(me.name);
    html += `<div class="result-item ${ok?'result-ok':'result-ng'}">
      <div class="result-horse">${ok?'✅':'🚨'} ${horse}</div>
      <div class="result-bidders">${bidders.join('、')}</div>
      ${isMine && (room.phase==='reveal'||room.phase==='conflict') ? `<button class="btn-edit" onclick="editMyBid()">✏️ 修正</button>` : ''}
    </div>`;
  }
  document.getElementById('reveal-results').innerHTML = html;

  // 競合解決UI
  const conflicts = room.conflicts || [];
  const resolved  = room.resolvedConflicts || {};
  const pending   = conflicts.filter(c => !resolved[c.horse]);
  let cHtml = '';
  if (pending.length > 0) {
    cHtml = '<div style="margin-top:14px"><p style="font-size:13px;font-weight:600;color:#b91c1c;margin-bottom:8px">⚔️ 競合馬の勝者をじゃんけんで決めてください</p>';
    pending.forEach(c => {
      cHtml += `<div class="conflict-box">
        <h4>「${c.horse}」— ${c.bidders.length}名が競合</h4>
        <div class="conflict-winner-btns">
          ${c.bidders.map(b => `<button class="btn btn-outline" style="font-size:12px;padding:7px 12px" onclick="resolveConflict('${c.horse}','${b}')">${b} の勝利</button>`).join('')}
        </div>
      </div>`;
    });
    cHtml += '</div>';
  }
  document.getElementById('conflict-area').innerHTML = cHtml;

  const allResolved = conflicts.every(c => resolved[c.horse]);
  const nextBtn = document.getElementById('btn-next');

  // 再指名待ちの人がいる場合は「次へ」を出さない
  const waitingRebid = document.getElementById('rebid-area');
  const rebidCandidates = room.rebidCandidates || [];
  if (allResolved && rebidCandidates.length > 0) {
    waitingRebid.innerHTML = `<div class="rebid-box">
      <h4>🔄 外れ指名 — 以下の方は別の母馬を指名してください</h4>
      <p style="font-size:13px;margin-bottom:8px">${rebidCandidates.join('、')}</p>
      <button class="btn btn-primary btn-full" onclick="startRebid()">外れ指名を開始する</button>
    </div>`;
    nextBtn.style.display = 'none';
    return;
  }
  waitingRebid.innerHTML = '';
  nextBtn.style.display = (conflicts.length === 0 || allResolved) ? '' : 'none';
  nextBtn.textContent = room.round >= room.maxRounds ? '🏆 最終結果を見る' : `第${room.round+1}巡目へ →`;
}

async function startRebid() {
  const snap = await roomRef.get();
  const room = snap.val();
  const losers = room.rebidCandidates || [];
  if (losers.length === 0) { toast('外れ指名対象者がいません'); return; }
  const bids = room.bids || {};
  losers.forEach(n => delete bids[n]);
  await roomRef.update({
    phase: 'input',
    bids,
    conflicts: [],
    resolvedConflicts: {},
    rebidPlayers: losers,
    rebidCandidates: []
  });
  toast('外れ指名を開始します');
}

async function resolveConflict(horse, winner) {
  const snap = await roomRef.get();
  const room = snap.val();
  const resolved = room.resolvedConflicts || {};
  resolved[horse] = winner;
  const rosters = room.rosters || {};
  if (!rosters[winner]) rosters[winner] = [];
  rosters[winner].push(horse);
  const pending = (room.conflicts||[]).filter(c => !resolved[c.horse]);
  const newPhase = pending.length === 0 ? 'reveal' : 'conflict';
  // 全競合解決時に敗者リストをFirebaseに保存
  let newRebidPlayers = [];
  if (pending.length === 0) {
    const allConflicts = room.conflicts || [];
    const losers = [];
    allConflicts.forEach(c => {
      const w = c.horse === horse ? winner : (resolved[c.horse] || null);
      if (w) c.bidders.forEach(b => { if (b !== w) losers.push(b); });
    });
    newRebidPlayers = [...new Set(losers)];
  }
  await roomRef.update({ resolvedConflicts: resolved, rosters, phase: newPhase, rebidCandidates: newRebidPlayers });
  toast(`${winner} が「${horse}」を獲得！`);
}

// ── 公開後の入力修正 ──────────────────────────────────────
function editMyBid() {
  const editArea = document.getElementById('rebid-area');
  const isMask = document.getElementById('mask-toggle').checked;
  const t = isMask ? 'password' : 'text';
  editArea.innerHTML = `<div class="edit-box">
    <h4>✏️ 自分の入力を修正する</h4>
    <p style="font-size:12px;color:#64748b;margin-bottom:8px">修正後、全員の入力が揃ったら再度一斉公開されます</p>
    <div style="display:flex;gap:8px;align-items:center">
      <input type="${t}" id="edit-bid-input" placeholder="正しい母馬名を入力" class="bid-input" style="flex:1;margin:0">
      <button class="btn btn-primary" style="white-space:nowrap;padding:10px 14px" onclick="confirmEdit()">確定</button>
      <button class="btn btn-outline" style="white-space:nowrap;padding:10px 14px" onclick="cancelEdit()">キャンセル</button>
    </div>
  </div>`;
  document.getElementById('btn-next').style.display = 'none';
  document.getElementById('conflict-area').innerHTML = '';
}

function cancelEdit() {
  document.getElementById('rebid-area').innerHTML = '';
}

async function confirmEdit() {
  const val = document.getElementById('edit-bid-input')?.value?.trim();
  if (!val) { toast('母馬名を入力してください'); return; }

  const snap = await roomRef.get();
  const room = snap.val();

  // 確定済みロスターに同じ馬がないかチェック
  const allNominated = Object.values(room.rosters || {}).flat();
  if (allNominated.some(h => normalizeHorse(h) === normalizeHorse(val))) {
    toast(`「${val}」はすでに指名されています！`);
    return;
  }

  // 全員のbidsを消して再入力フェーズへ（修正者の新しい値だけ保持）
  const newBids = { [me.name]: normalizeHorse(val) };

  await roomRef.update({
    phase: 'input',
    bids: newBids,
    conflicts: [],
    resolvedConflicts: {},
    rebidPlayers: [],
    rebidCandidates: [],
    editingPlayer: me.name
  });
  toast('入力を修正しました。他の参加者の再入力を待っています');
  document.getElementById('rebid-area').innerHTML = '';
}

async function proceedNext() {
  const snap = await roomRef.get();
  const room = snap.val();
  if (room.round >= room.maxRounds) {
    await roomRef.update({ status: 'finished' });
  } else {
    await roomRef.update({
      round: room.round + 1, phase: 'input',
      bids: {}, conflicts: [], resolvedConflicts: {}, rebidPlayers: []
    });
  }
}

function renderRosterBoard(room, elId) {
  const el = document.getElementById(elId);
  if (!el) return;
  const players = room.players || [];
  const rosters = room.rosters || {};
  el.innerHTML = players.map(p => {
    const list = rosters[p.name] || [];
    let rows = '';
    for (let i = 0; i < room.maxRounds; i++) {
      rows += `<div class="roster-row ${list[i]?'':'empty'}">${list[i] || `${i+1}巡`}</div>`;
    }
    return `<div class="roster-col">
      <div class="roster-head" style="color:${p.color}">${p.name}</div>
      ${rows}
    </div>`;
  }).join('');
}

function renderFinalRoster(room) { renderRosterBoard(room, 'final-roster'); }

function resetApp() {
  if (unsubscribe) unsubscribe();
  me = { name: '', roomCode: '', isHost: false };
  lastSnapshot = null;
  showScreen('lobby');
}

window.onload = () => initFirebase();
</script>
